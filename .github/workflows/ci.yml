name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rendezvous
          POSTGRES_USER: rendezvous
          POSTGRES_PASSWORD: rendezvous
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rendezvous -d rendezvous"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rendezvous:rendezvous@localhost:5432/rendezvous
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan tracked sources for committed secrets
        run: npm run secrets:scan
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --no-file-parallelism
      - run: npm run build
