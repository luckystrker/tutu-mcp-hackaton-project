services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rendezvous
      POSTGRES_USER: rendezvous
      POSTGRES_PASSWORD: rendezvous
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rendezvous -d rendezvous"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - rendezvous-postgres:/var/lib/postgresql/data

volumes:
  rendezvous-postgres:
