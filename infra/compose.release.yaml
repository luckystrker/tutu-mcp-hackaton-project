services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rendezvous
      POSTGRES_USER: rendezvous
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - rendezvous-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rendezvous -d rendezvous"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "1"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PUBLIC_MINI_APP_URL: ${PUBLIC_MINI_APP_URL:?PUBLIC_MINI_APP_URL is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}
      TELEGRAM_MINI_APP_SHORT_NAME: ${TELEGRAM_MINI_APP_SHORT_NAME:?TELEGRAM_MINI_APP_SHORT_NAME is required}
      TUTU_MCP_URL: ${TUTU_MCP_URL:-https://mcp.tutu.ru/mcp}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.0}
      BUILD_SHA: ${BUILD_SHA:?BUILD_SHA is required}
      BUILD_TIME: ${BUILD_TIME:?BUILD_TIME is required}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_BUILD_SHA: ${BUILD_SHA:?BUILD_SHA is required}
        VITE_BUILD_TIME: ${BUILD_TIME:?BUILD_TIME is required}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  rendezvous-data:
